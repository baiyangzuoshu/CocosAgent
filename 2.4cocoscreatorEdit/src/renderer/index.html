<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self';">
    <title>Cocos Creator Lite</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">C</div>
          <div class="brand-copy">
            <strong>Cocos Creator Lite</strong>
            <span>2.4.15 Runtime Lab</span>
          </div>
        </div>
        <div class="toolbar-actions">
          <button class="toolbar-button" data-action="new-project" type="button">新建</button>
          <button class="toolbar-button" data-action="open-project" type="button">打开</button>
          <span class="toolbar-divider"></span>
          <button class="toolbar-button" data-action="save-project" type="button" disabled>保存</button>
          <button class="toolbar-button run-button" data-action="run" type="button"><span class="play-icon">▶</span>运行</button>
          <button class="toolbar-button build-button" data-action="build-web" type="button" disabled>构建 Web</button>
        </div>
        <div class="topbar-project">
          <span class="status-dot"></span>
          <span id="project-label">示例场景 · 未保存</span>
          <button class="icon-button" data-action="open-location" type="button" title="打开项目目录" disabled>↗</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="panel hierarchy-panel">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">SCENE</span>
              <h1>层级</h1>
            </div>
            <span class="node-count" id="node-count">0</span>
          </div>
          <div class="tree-toolbar">
            <span>主场景</span>
            <button class="icon-button" data-action="add-node" type="button" title="添加节点">＋</button>
          </div>
          <div class="hierarchy-tree" id="hierarchy-tree" role="tree"></div>
          <div class="hierarchy-footer">
            <button class="small-action" data-create="node" type="button">＋ 节点</button>
            <button class="small-action" data-create="label" type="button">＋ Label</button>
            <button class="small-action" data-create="sprite" type="button">＋ Sprite</button>
            <button class="delete-action" data-action="delete-node" type="button" disabled>删除选中</button>
          </div>
        </aside>

        <main class="viewport-panel">
          <div class="viewport-heading">
            <div class="scene-tab">
              <span class="scene-tab-icon">◈</span>
              <span id="scene-title">Main.scene.json</span>
              <span class="unsaved-indicator" id="unsaved-indicator" title="未保存修改"></span>
            </div>
            <div class="viewport-meta">
              <span class="engine-badge">CC 2.4.15</span>
              <span id="resolution-label">960 × 640</span>
            </div>
          </div>
          <div class="viewport-stage">
            <div class="viewport-grid"></div>
            <iframe
              id="runtime-frame"
              title="Cocos Creator 2.4.15 运行时视口"
              src="/runtime/index.html?editor=1"
              allow="autoplay"
            ></iframe>
            <div class="viewport-loading" id="runtime-status">正在启动 Creator 2.4.15 运行时…</div>
          </div>
          <div class="viewport-footer">
            <span class="runtime-led"></span>
            <span id="runtime-label">连接 2.4.15 Web Mobile 运行时</span>
            <span class="footer-spacer"></span>
            <span>二维场景</span>
          </div>
        </main>

        <aside class="panel inspector-panel">
          <div class="panel-heading inspector-heading">
            <div>
              <span class="eyebrow">PROPERTIES</span>
              <h1>检查器</h1>
            </div>
            <span class="inspector-type" id="inspector-type">NODE</span>
          </div>
          <div class="inspector-content" id="inspector-content"></div>
        </aside>
      </div>

      <footer class="statusbar">
        <span class="status-icon" id="status-icon">●</span>
        <span id="status-message">简化格式编辑 · 实际引擎运行时预览</span>
        <span class="status-spacer"></span>
        <span id="project-path">尚未创建或打开项目</span>
      </footer>
    </div>
    <dialog class="modal-dialog" id="new-project-dialog">
      <form method="dialog">
        <div class="modal-kicker">NEW PROJECT</div>
        <h2>新建项目</h2>
        <p>选择一个名称和保存位置，当前示例场景会复制到新项目。</p>
        <label class="modal-field">
          <span>项目名称</span>
          <input id="new-project-name" type="text" maxlength="80" value="MyCocosProject" required>
        </label>
        <div class="modal-actions">
          <button class="toolbar-button" value="cancel">取消</button>
          <button class="toolbar-button build-button" value="create">选择位置并创建</button>
        </div>
      </form>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
