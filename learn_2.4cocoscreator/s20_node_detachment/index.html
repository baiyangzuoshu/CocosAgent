<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第 20 课：Node 与 Component 的启停</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.55 system-ui, sans-serif; }
      body { margin: 0; background: #171a24; color: #eee; }
      main { max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
      .controls { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
      button { padding: .55rem .8rem; }
      pre { white-space: pre-wrap; background: #222a39; padding: 1rem; border-radius: .5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>第 20 课：Node 与 Component 的启停</h1>
      <p>等首次 update 后分别操作：节点自己的 active、组件自己的 enabled、以及把节点移出/重新挂载到活动 Scene。</p>
      <div class="controls">
        <button id="toggle-node-active" type="button" disabled>等待 start</button>
        <button id="toggle-component-enabled" type="button" disabled>等待 start</button>
        <button id="toggle-parent" type="button" disabled>等待 start</button>
        <button id="toggle-combined" type="button" disabled>等待 start</button>
      </div>
      <pre id="status">等待场景启动……</pre>
      <p>组合按钮先禁用组件，再移出并重新挂载节点；节点回到活动层级后，组件仍保持禁用。再次点击才恢复组件。</p>
    </main>
    <script type="module" src="./dist/src/main.js"></script>
  </body>
</html>
