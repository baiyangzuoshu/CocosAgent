<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第 14 课：浏览器输入坐标换算</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 sans-serif; }
      body { margin: 0; background: #171a24; color: #eee; }
      main { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
      canvas {
        display: block;
        width: 480px;
        max-width: 100%;
        height: auto;
        margin: 1rem 0;
        outline: 2px solid #7c8eaa;
        background: #263448;
        touch-action: none;
      }
      .formula, pre { white-space: pre-wrap; background: #222a39; padding: 1rem; }
      .note { color: #bdc9dc; }
    </style>
  </head>
  <body>
    <main>
      <h1>第 14 课：浏览器输入坐标换算</h1>
      <p>画布 backing-store 是 320×200；桌面 CSS 展示宽度为 480px。点击或触摸空白画布，观察每一步坐标，不绘制 Sprite。</p>
      <div class="formula">clientX/Y → 减去画布位置 → CSS 局部坐标 → backing-store 比例缩放 → 左下原点画布坐标</div>
      <canvas id="game" width="320" height="200" aria-label="输入坐标观察画布"></canvas>
      <p class="note">左下角接近 (0,0)，中心接近 (160,100)，左上角接近 (0,200)。实际结果以页面显示的 CSS 区域尺寸为准。</p>
      <pre id="status">正在载入课程代码……</pre>
    </main>
    <script type="module" src="./dist/src/main.js"></script>
  </body>
</html>
