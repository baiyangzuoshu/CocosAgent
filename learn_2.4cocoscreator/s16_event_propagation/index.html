<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第 16 课：节点事件传播</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.55 system-ui, sans-serif; }
      body { margin: 0; background: #171a24; color: #eee; }
      main { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
      .tree { margin: .75rem 0; color: #cbd5e1; }
      .stage { position: relative; width: 320px; height: 200px; margin: 1rem 0; }
      canvas { position: absolute; inset: 0; touch-action: none; outline: 1px solid #67718a; background: #263448; }
      #hitbox { position: absolute; left: 132px; top: 72px; width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #fde68a; display: grid; place-items: center; color: #fde68a; font: 11px/1.2 system-ui, sans-serif; pointer-events: none; }
      pre { white-space: pre-wrap; background: #222a39; padding: 1rem; border-radius: .5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>第 16 课：节点事件传播</h1>
      <p class="tree">父链：MainScene → Branch → Target</p>
      <label><input id="stop" type="checkbox" /> 在 Branch 捕获阶段调用 stopPropagation()</label>
      <p>点击黄色 Target 方框，逐行观察事件阶段、固定的 <code>target</code> 与变化的 <code>currentTarget</code>。CSS 方框只用于定位。</p>
      <div class="stage"><canvas id="game" width="320" height="200" aria-label="事件传播命中区域"></canvas><div id="hitbox">Target</div></div>
      <pre id="status">正在载入课程代码……</pre>
    </main>
    <script type="module" src="./dist/src/main.js"></script>
  </body>
</html>
