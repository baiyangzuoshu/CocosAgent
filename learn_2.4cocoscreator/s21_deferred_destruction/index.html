<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第 21 课：销毁请求与队列处理</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.55 system-ui, sans-serif; }
      body { margin: 0; background: #171a24; color: #eee; }
      main { max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
      .controls { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
      button { padding: .55rem .8rem; }
      pre { white-space: pre-wrap; background: #222a39; padding: 1rem; border-radius: .5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>第 21 课：销毁请求与队列处理</h1>
      <ol>
        <li>EnemyA：只移出活动场景，保留对象。</li>
        <li>EnemyB：调用 <code>destroy()</code>，记录返回后与队列处理后的状态。</li>
      </ol>
      <div class="controls">
        <button id="toggle-enemy" type="button" disabled>等待 start</button>
        <button id="destroy-enemy" type="button" disabled>销毁 EnemyB</button>
      </div>
      <pre id="status">等待场景启动……</pre>
    </main>
    <script type="module" src="./dist/src/main.js"></script>
  </body>
</html>
