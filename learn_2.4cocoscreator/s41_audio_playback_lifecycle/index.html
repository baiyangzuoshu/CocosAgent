<html lang="zh-CN">

  <title>第 41 课：音频播放生命周期</title>

<body>
  <main>
    <h1>第 41 课：播放、暂停、恢复与停止</h1>
    <p>播放、暂停、恢复或停止短音频；自然播放结束时观察完成回调。</p>
    <button id="play">播放</button>
    <button id="pause">暂停</button>
    <button id="resume">恢复</button>
    <button id="stop">停止</button>
    <pre id="output">等待播放</pre>
  </main>
