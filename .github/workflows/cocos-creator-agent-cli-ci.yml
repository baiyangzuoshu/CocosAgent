name: Cocos Creator Agent CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run CLI test suite
        working-directory: cocos-creator-agent-cli
        run: npm test
      - name: Check release helper syntax
        working-directory: cocos-creator-agent-cli
        run: node --check publish-release.mjs
      - name: Verify npm package contents
        working-directory: cocos-creator-agent-cli
        run: npm pack --dry-run --json
