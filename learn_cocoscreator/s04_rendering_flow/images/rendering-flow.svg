<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1510" viewBox="0 0 1680 1510" role="img" aria-labelledby="title desc">
  <title id="title">Creator 2.4.15 WebGL 渲染流程</title>
  <desc id="desc">从 Director.mainLoop 的 renderer.render，经 RenderFlow 节点标记、Simple Sprite 顶点索引批次、Camera View、BaseRenderer，最终进入 WebGL Device.draw。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#526277"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fae"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7657b5"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#37855f"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#b9681d"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17263b; }
      .title { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526277; }
      .lane { font-size: 17px; font-weight: 700; }
      .step { font-size: 14px; font-weight: 700; fill: #fff; }
      .head { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; fill: #34465d; }
      .small { font-size: 11px; fill: #526277; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #26364b; }
      .card { fill: #fff; stroke: #cbd6e2; stroke-width: 1.5; }
      .blue { fill: #eef6ff; stroke: #91b8df; stroke-width: 1.5; }
      .green { fill: #edf8f2; stroke: #8fc3a3; stroke-width: 1.5; }
      .warm { fill: #fff5e9; stroke: #e2ae76; stroke-width: 1.5; }
      .purple { fill: #f4f0ff; stroke: #b9a9e0; stroke-width: 1.5; }
      .line { fill: none; stroke: #526277; stroke-width: 2.2; marker-end: url(#arrow); }
      .lineBlue { fill: none; stroke: #2f6fae; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .linePurple { fill: none; stroke: #7657b5; stroke-width: 2.2; marker-end: url(#arrowPurple); }
      .lineGreen { fill: none; stroke: #37855f; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .lineOrange { fill: none; stroke: #b9681d; stroke-width: 2.2; marker-end: url(#arrowOrange); }
    </style>
  </defs>
  <rect width="1680" height="1510" fill="#f6f8fb"/>
  <text x="58" y="58" class="title">渲染流程：从场景节点到 WebGL draw call</text>
  <text x="58" y="86" class="subtitle">Creator 2.4.15 WebGL · RenderFlow 生成几何与 RenderScene，Camera View 再提交绘制</text>
  <rect x="1352" y="37" width="270" height="38" rx="19" fill="#e8eef6"/>
  <text x="1487" y="61" text-anchor="middle" class="small">范围：WebGL 主路径 · 2D Simple Sprite</text>

  <text x="58" y="132" class="lane">一、帧更新之后进入渲染</text>
  <rect x="58" y="151" width="420" height="145" rx="13" class="blue"/>
  <circle cx="88" cy="183" r="16" fill="#2f6fae"/><text x="88" y="188" text-anchor="middle" class="step">1</text>
  <text x="117" y="188" class="head">Director.mainLoop</text>
  <text x="82" y="222" class="mono">EVENT_BEFORE_DRAW</text>
  <text x="82" y="247" class="mono">renderer.render(scene, dt)</text>
  <text x="82" y="276" class="small">更新与延迟销毁之后；渲染之后发 EVENT_AFTER_DRAW</text>

  <path d="M478 223 H520" class="lineBlue"/>
  <rect x="530" y="151" width="420" height="145" rx="13" class="blue"/>
  <circle cx="560" cy="183" r="16" fill="#2f6fae"/><text x="560" y="188" text-anchor="middle" class="step">2</text>
  <text x="589" y="188" class="head">renderer.render</text>
  <text x="554" y="222" class="mono">device.resetDrawCalls()</text>
  <text x="554" y="247" class="mono">_flow.render(ecScene, dt)</text>
  <text x="554" y="276" class="small">本帧统计清零，场景进入渲染流程</text>

  <path d="M950 223 H992" class="lineBlue"/>
  <rect x="1002" y="151" width="620" height="145" rx="13" class="purple"/>
  <circle cx="1032" cy="183" r="16" fill="#7657b5"/><text x="1032" y="188" text-anchor="middle" class="step">3</text>
  <text x="1061" y="188" class="head">RenderFlow.render</text>
  <text x="1026" y="222" class="mono">batcher.reset → visitRootNode → batcher.terminate</text>
  <text x="1026" y="247" class="mono">→ ForwardRenderer.render(RenderScene, dt)</text>
  <text x="1026" y="276" class="small">遍历阶段产出模型；Camera 绘制在后续阶段</text>

  <text x="58" y="342" class="lane">二、RenderFlow 按节点标记执行工作</text>
  <rect x="58" y="360" width="400" height="132" rx="13" class="purple"/>
  <circle cx="88" cy="392" r="16" fill="#7657b5"/><text x="88" y="397" text-anchor="middle" class="step">4</text>
  <text x="117" y="397" class="head">visitRootNode</text>
  <text x="82" y="430" class="mono">validateRenderers()</text>
  <text x="82" y="455" class="body">根节点世界矩阵脏时先重算</text>
  <text x="82" y="477" class="body">再用 root._renderFlag 选择流程</text>

  <path d="M458 426 H490" class="line"/>
  <rect x="500" y="360" width="1122" height="132" rx="13" class="card"/>
  <circle cx="530" cy="392" r="16" fill="#526277"/><text x="530" y="397" text-anchor="middle" class="step">5</text>
  <text x="559" y="397" class="head">getFlow(flag)：置位操作组合成函数链</text>
  <rect x="526" y="423" width="124" height="42" rx="8" fill="#eef6ff"/><text x="588" y="449" text-anchor="middle" class="mono">LOCAL</text>
  <path d="M650 444 H672" class="line"/>
  <rect x="680" y="423" width="124" height="42" rx="8" fill="#eef6ff"/><text x="742" y="449" text-anchor="middle" class="mono">WORLD</text>
  <path d="M804 444 H826" class="line"/>
  <rect x="834" y="423" width="160" height="42" rx="8" fill="#edf8f2"/><text x="914" y="449" text-anchor="middle" class="mono">UPDATE_DATA</text>
  <path d="M994 444 H1016" class="line"/>
  <rect x="1024" y="423" width="104" height="42" rx="8" fill="#fff5e9"/><text x="1076" y="449" text-anchor="middle" class="mono">OPACITY</text>
  <path d="M1128 444 H1150" class="line"/>
  <rect x="1158" y="423" width="90" height="42" rx="8" fill="#fff5e9"/><text x="1203" y="449" text-anchor="middle" class="mono">COLOR</text>
  <path d="M1248 444 H1270" class="line"/>
  <rect x="1278" y="423" width="90" height="42" rx="8" fill="#fff5e9"/><text x="1323" y="449" text-anchor="middle" class="mono">RENDER</text>
  <path d="M1368 444 H1390" class="line"/>
  <rect x="1398" y="423" width="90" height="42" rx="8" fill="#f4f0ff"/><text x="1443" y="449" text-anchor="middle" class="mono">CHILDREN</text>
  <path d="M1488 444 H1510" class="line"/>
  <rect x="1518" y="423" width="80" height="42" rx="8" fill="#f4f0ff"/><text x="1558" y="449" text-anchor="middle" class="mono">POST</text>
  <text x="558" y="480" class="small">每个节点按自己的 flag 子集运行；不是每个节点都会执行完整链</text>

  <path d="M700 492 V518 H410 V540" class="linePurple"/>
  <path d="M700 518 H840 V540" class="lineGreen"/>
  <path d="M700 518 H1325 V540" class="lineOrange"/>
  <rect x="58" y="548" width="692" height="190" rx="13" class="purple"/>
  <circle cx="88" cy="580" r="16" fill="#7657b5"/><text x="88" y="585" text-anchor="middle" class="step">6</text>
  <text x="117" y="585" class="head">CHILDREN：递归访问活动子节点</text>
  <text x="82" y="620" class="mono">for child in node._children</text>
  <text x="82" y="647" class="body">传播矩阵 / 透明度脏标记，再访问子节点的 flow</text>
  <text x="82" y="674" class="body">跳过 !_activeInHierarchy 或 opacity === 0</text>
  <text x="82" y="710" class="small">groupIndex 生成/继承 cullingMask，供 Camera 阶段筛选</text>

  <rect x="780" y="548" width="402" height="190" rx="13" class="green"/>
  <circle cx="810" cy="580" r="16" fill="#37855f"/><text x="810" y="585" text-anchor="middle" class="step">7</text>
  <text x="839" y="585" class="head">UPDATE_RENDER_DATA</text>
  <text x="804" y="620" class="mono">assembler.updateRenderData(comp)</text>
  <text x="804" y="652" class="body">Sprite 可在此更新 UV 和顶点</text>
  <text x="804" y="680" class="body">脏标记清除后进入下一 flow</text>
  <text x="804" y="710" class="small">只在相应 flag 置位时执行</text>

  <rect x="1212" y="548" width="410" height="190" rx="13" class="warm"/>
  <circle cx="1242" cy="580" r="16" fill="#b9681d"/><text x="1242" y="585" text-anchor="middle" class="step">8</text>
  <text x="1271" y="585" class="head">RENDER：组件写入批次</text>
  <text x="1236" y="620" class="mono">_checkBacth(batch, cullingMask)</text>
  <text x="1236" y="647" class="mono">assembler.fillBuffers(comp, batch)</text>
  <text x="1236" y="680" class="body">材质/掩码变化时可能先 flush</text>
  <text x="1236" y="710" class="small">此处写入几何数据，还没有 draw call</text>

  <text x="58" y="784" class="lane">三、以 2D Simple Sprite 看 CPU 几何如何变成 RenderScene 模型</text>
  <rect x="58" y="804" width="710" height="196" rx="13" class="green"/>
  <circle cx="88" cy="836" r="16" fill="#37855f"/><text x="88" y="841" text-anchor="middle" class="step">9</text>
  <text x="117" y="841" class="head">SimpleSpriteAssembler → Assembler2D</text>
  <text x="82" y="877" class="mono">spriteFrame.uv → 4 顶点 UV</text>
  <text x="82" y="905" class="mono">node 尺寸 / anchor / worldMatrix → 顶点位置</text>
  <text x="82" y="939" class="body">fillBuffers 申请 MeshBuffer 区间，复制顶点数组与索引</text>
  <g transform="translate(520 867)">
    <rect x="0" y="0" width="184" height="88" rx="8" fill="#fff" stroke="#91b8a0"/>
    <circle cx="20" cy="20" r="5" fill="#37855f"/><circle cx="164" cy="20" r="5" fill="#37855f"/>
    <circle cx="20" cy="68" r="5" fill="#37855f"/><circle cx="164" cy="68" r="5" fill="#37855f"/>
    <text x="92" y="49" text-anchor="middle" class="small">Vertex + UV + Color</text>
  </g>
  <text x="82" y="979" class="small">这是 Simple 2D Sprite 路径；其他组件使用各自的 assembler</text>

  <path d="M768 902 H812" class="lineGreen"/>
  <rect x="822" y="804" width="800" height="196" rx="13" class="warm"/>
  <circle cx="852" cy="836" r="16" fill="#b9681d"/><text x="852" y="841" text-anchor="middle" class="step">10</text>
  <text x="881" y="841" class="head">ModelBatcher：批次 flush → InputAssembler + Model</text>
  <text x="846" y="877" class="mono">material hash / cullingMask / buffer 容量变化 → _flush()</text>
  <text x="846" y="905" class="mono">Model.setEffect + setInputAssembler → RenderScene.addModel</text>
  <text x="846" y="939" class="body">遍历结束 terminate：flush 剩余批次，VertexBuffer / IndexBuffer.update</text>
  <text x="846" y="979" class="small">RenderScene 提供给 ForwardRenderer；节点数不等于模型数或 draw call 数</text>

  <text x="58" y="1044" class="lane">四、Camera View 将 RenderScene 项目提交给 WebGL</text>
  <rect x="58" y="1064" width="330" height="278" rx="13" class="blue"/>
  <circle cx="88" cy="1096" r="16" fill="#2f6fae"/><text x="88" y="1101" text-anchor="middle" class="step">11</text>
  <text x="117" y="1101" class="head">ForwardRenderer</text>
  <text x="82" y="1140" class="mono">scene._cameras</text>
  <text x="82" y="1170" class="body">Camera.extractView()</text>
  <text x="82" y="1200" class="body">priority 排序</text>
  <text x="82" y="1240" class="mono">_render(view, scene)</text>
  <text x="82" y="1307" class="small">每个 Camera 产生一个 View</text>

  <path d="M388 1202 H425" class="lineBlue"/>
  <rect x="435" y="1064" width="410" height="278" rx="13" class="blue"/>
  <circle cx="465" cy="1096" r="16" fill="#2f6fae"/><text x="465" y="1101" text-anchor="middle" class="step">12</text>
  <text x="494" y="1101" class="head">BaseRenderer._render</text>
  <text x="459" y="1140" class="mono">framebuffer · viewport · clear</text>
  <text x="459" y="1170" class="body">收集 RenderScene 的 Model</text>
  <text x="459" y="1200" class="body">按 model/view cullingMask 过滤</text>
  <text x="459" y="1230" class="body">按 Effect.stagePasses 分派 stage</text>
  <text x="459" y="1307" class="small">此处是掩码筛选，不代表视锥剔除</text>

  <path d="M845 1202 H882" class="lineBlue"/>
  <rect x="892" y="1064" width="360" height="278" rx="13" class="warm"/>
  <circle cx="922" cy="1096" r="16" fill="#b9681d"/><text x="922" y="1101" text-anchor="middle" class="step">13</text>
  <text x="951" y="1101" class="head">BaseRenderer._draw</text>
  <text x="916" y="1140" class="mono">逐 Pass 设置 VB / IB</text>
  <text x="916" y="1170" class="body">program 与 uniform</text>
  <text x="916" y="1200" class="body">Blend / Depth / Stencil</text>
  <text x="916" y="1240" class="mono">device.draw(base, count)</text>
  <text x="916" y="1307" class="small">一次 Pass 可产生一次 Device.draw</text>

  <path d="M1252 1202 H1289" class="lineOrange"/>
  <rect x="1299" y="1064" width="323" height="278" rx="13" class="warm"/>
  <circle cx="1329" cy="1096" r="16" fill="#b9681d"/><text x="1329" y="1101" text-anchor="middle" class="step">14</text>
  <text x="1358" y="1101" class="head">WebGL Device.draw</text>
  <text x="1323" y="1140" class="mono">提交 GL 状态 / 缓冲</text>
  <text x="1323" y="1174" class="mono">有 IB → gl.drawElements</text>
  <text x="1323" y="1208" class="mono">无 IB → gl.drawArrays</text>
  <text x="1323" y="1242" class="body">非零 count 才计入 drawCalls</text>
  <text x="1323" y="1307" class="small">到此才进入 WebGL 绘制调用</text>

  <rect x="58" y="1370" width="1564" height="76" rx="12" fill="#e8eef6"/>
  <text x="82" y="1402" class="head">理解这条边界</text>
  <text x="265" y="1402" class="body">RenderFlow 负责遍历和几何收集；Camera / Renderer 负责视图、Pass 与状态；Device 才调用 WebGL。</text>
  <text x="82" y="1428" class="small">源码范围：Creator 2.4.15 WebGL；Canvas、JSB Native Renderer、离屏目标及其他 assembler 路径另行处理。</text>
</svg>
