<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1280" viewBox="0 0 1500 1280" role="img" aria-labelledby="title desc">
<title id="title">Creator 2.4.15：场景激活、组件更新与渲染遍历</title><desc id="desc">场景激活时递归节点并注册组件；每帧 Director 先通过组件队列更新，再由渲染流程遍历场景树。两次遍历用途不同。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#7990ad"/></marker><style>
.bg{fill:#f4f7fc}.panel{fill:#fff;stroke:#dbe5f1;stroke-width:2}.node{fill:#f7faff;stroke:#cbdbef;stroke-width:2}.blue{fill:#eaf2ff;stroke:#bad1f3;stroke-width:2}.green{fill:#eaf8f1;stroke:#b9dfca;stroke-width:2}.amber{fill:#fff8e9;stroke:#ead5a8;stroke-width:2}.line{fill:none;stroke:#7990ad;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#7990ad;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#273a52}.title{font-size:34px;font-weight:700}.section{font-size:22px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#5e718b}.mono{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:600;fill:#285a94}
</style></defs>
<rect class="bg" width="1500" height="1280" rx="18"/><text class="title" x="52" y="61">场景树何时遍历？组件何时更新？</text><text class="body" x="54" y="95">Creator 2.4.15 · Web 非编辑器路径 · 按源码职责提炼</text>
<rect class="panel" x="40" y="122" width="1420" height="330" rx="16"/><text class="section" x="68" y="160">① 场景进入时：递归激活节点并注册组件</text>
<rect class="blue" x="68" y="190" width="360" height="160" rx="12"/><text class="mono" x="88" y="223">runSceneImmediate(scene)</text><text class="body" x="88" y="257">_load → 设置当前场景</text><text class="body" x="88" y="287">→ scene._activate()</text><text class="small" x="88" y="327">CCDirector.js:400 / CCScene.js:72</text>
<path class="line" d="M428 270H465"/>
<rect class="blue" x="470" y="190" width="440" height="160" rx="12"/><text class="mono" x="490" y="223">NodeActivator.activateNode</text><text class="body" x="490" y="257">递归标记 activeInHierarchy</text><text class="body" x="490" y="287">处理组件、仅递归 active 子节点</text><text class="small" x="490" y="327">node-activator.js:135 / 219</text>
<path class="line" d="M910 270H947"/>
<rect class="green" x="952" y="190" width="480" height="160" rx="12"/><text class="mono" x="972" y="223">ComponentScheduler</text><text class="body" x="972" y="257">启用组件 → _scheduleImmediate</text><text class="body" x="972" y="287">有 update 的组件加入 updateInvoker</text><text class="small" x="972" y="327">component-scheduler.js:322 / 422</text>
<text class="small" x="70" y="405">激活及启用状态变化时处理节点；这不是 update 阶段每帧重新遍历整棵树。</text>

<rect class="panel" x="40" y="480" width="1420" height="650" rx="16"/><text class="section" x="68" y="519">② 每个有效帧：先更新组件，再进入渲染流程</text>
<rect class="blue" x="70" y="545" width="1358" height="82" rx="10"/><text class="mono" x="92" y="578">requestAnimFrame callback → CCGame → director.mainLoop(now)</text><text class="small" x="92" y="608">注册下一次回调；Director 计算 dt。Web 30 FPS 会交替跳过部分浏览器回调。</text>
<path class="line" d="M750 627V651"/>
<rect class="node" x="70" y="655" width="1358" height="70" rx="10"/><text class="body" x="92" y="697">正常帧顺序：start → <tspan font-weight="700">updatePhase</tspan> → scheduler.update → lateUpdate → 延迟销毁 → <tspan font-weight="700">renderer.render</tspan></text>
<path class="line" d="M400 725V755"/><path class="line" d="M1094 725V755"/>
<rect class="blue" x="70" y="759" width="650" height="292" rx="12"/><text class="head" x="92" y="795">A　游戏逻辑：遍历组件队列</text><text class="mono" x="92" y="839">_compScheduler.updatePhase(dt)</text><text class="mono" x="92" y="874">→ updateInvoker.invoke(dt)</text><text class="mono" x="92" y="909">→ component.update(dt)</text><text class="body" x="92" y="951">处理此前已启用并注册的组件</text><text class="small" x="92" y="1002">component-scheduler.js:256 / 462</text><text class="small" x="92" y="1026">本阶段不递归场景树。</text>
<rect class="green" x="770" y="759" width="658" height="292" rx="12"/><text class="head" x="792" y="795">B　渲染：遍历场景节点</text><text class="mono" x="792" y="839">renderer.render(scene, dt)</text><text class="mono" x="792" y="874">→ RenderFlow.visitRootNode(scene)</text><text class="mono" x="792" y="909">→ _children(node) → 子节点流程</text><text class="body" x="792" y="951">跳过未激活或自身透明度为 0 的子节点</text><text class="small" x="792" y="1002">renderer/index.js:126 / render-flow.js:85</text><text class="small" x="792" y="1026">课程只观察访问；批处理与实际绘制是空边界。</text>

<text class="small" x="53" y="1184">激活阶段建立组件队列；场景树变更、生命周期排序和 GPU 绘制的完整行为请查看对应源码。</text><text class="small" x="53" y="1213">图基于静态源码；示例使用受控帧回调，不代表完整 Creator Runtime 的实测。</text>
</svg>
